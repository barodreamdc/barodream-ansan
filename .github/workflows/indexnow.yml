name: IndexNow 알림 (Bing·네이버)

# main에 HTML/사이트맵이 바뀌어 올라오면, 바뀐 페이지 URL을 IndexNow로 통보합니다.
# Actions 탭에서 "Run workflow"로 직접 실행하면 사이트맵 전체 URL을 한 번에 통보합니다.

on:
  push:
    branches: [main]
    paths: ["**.html", "sitemap.xml", "sitemap-ru.xml"]
  workflow_dispatch:
    inputs:
      all:
        description: "사이트맵의 모든 URL 통보 (true/false)"
        default: "true"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: URL 목록 만들기
        id: urls
        run: |
          HOST=barodreamdental.kr
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.all }}" = "true" ]; then
            grep -oh '<loc>[^<]*</loc>' sitemap.xml sitemap-ru.xml | sed 's/<\/\?loc>//g' > urls.txt
          else
            git diff --name-only HEAD~1 HEAD -- '*.html' | grep -v '^404.html$' | grep -v '^tests/' \
              | sed -E 's#^index\.html$##; s#/index\.html$#/#; s#^#https://'"$HOST"'/#' > urls.txt || true
          fi
          sort -u urls.txt -o urls.txt
          echo "count=$(wc -l < urls.txt)" >> "$GITHUB_OUTPUT"
          echo "통보할 URL $(wc -l < urls.txt)개:"; cat urls.txt
      - name: IndexNow 전송
        if: steps.urls.outputs.count != '0'
        run: |
          KEY=8da1f7efdecabc682bb8b2fd328e0851
          python3 - << 'PY'
          import json, urllib.request, os
          urls=[u.strip() for u in open("urls.txt") if u.strip()]
          key="8da1f7efdecabc682bb8b2fd328e0851"
          for i in range(0, len(urls), 10000):
              body=json.dumps({"host":"barodreamdental.kr","key":key,"keyLocation":f"https://barodreamdental.kr/{key}.txt","urlList":urls[i:i+10000]}).encode()
              req=urllib.request.Request("https://api.indexnow.org/indexnow", data=body, headers={"Content-Type":"application/json; charset=utf-8"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r: print("IndexNow 응답:", r.status)
              except urllib.error.HTTPError as e: print("IndexNow 응답:", e.code, e.read()[:200])
          PY
